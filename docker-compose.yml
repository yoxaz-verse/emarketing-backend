services:
  backend:
    build: .
    container_name: obaol-backend
    ports:
      - "${PORT:-3004}:${PORT:-3004}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-3004}/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
